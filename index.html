<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checklist Setup Empacotadoras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3f1ea;--card:#ffffff;--ink:#1c1e22;--mute:#5b5f67;--line:#d9d5c9;--edge:#8d897d;--field:#faf9f5;
  --acc:#c4101b;--accfill:#c4101b;--accbg:#fbe8e9;
  --ok:#17692f;--ok-bg:#e1f2e6;--bad:#a30b14;--bad-bg:#fbe3e4;--warn:#774c00;--warn-bg:#fff0cb;
  --fh:'Barlow Semi Condensed',system-ui,sans-serif;--f:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131416;--card:#1d1f23;--ink:#eceef1;--mute:#a1a6ae;--line:#34373d;--edge:#6d717a;--field:#17181b;
    --acc:#ff6b72;--accbg:#3a1a1c;--ok:#7ddb96;--ok-bg:#15301c;--bad:#ff9fa4;--bad-bg:#3b1719;--warn:#f2c970;--warn-bg:#33290f;
  }
}
:root[data-theme="dark"]{
  --paper:#131416;--card:#1d1f23;--ink:#eceef1;--mute:#a1a6ae;--line:#34373d;--edge:#6d717a;--field:#17181b;
  --acc:#ff6b72;--accbg:#3a1a1c;--ok:#7ddb96;--ok-bg:#15301c;--bad:#ff9fa4;--bad-bg:#3b1719;--warn:#f2c970;--warn-bg:#33290f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 56px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #f2a900;outline-offset:2px}

/* cabeçalho de formulário */
.doc{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:3px solid var(--ink);padding-bottom:12px}
.doc .co{font-family:var(--fh);font-weight:700;font-style:italic;color:var(--acc);letter-spacing:.5px;font-size:.95rem}
.doc h1{margin:2px 0 0;font-family:var(--fh);font-weight:700;font-size:1.6rem;line-height:1.05;text-transform:uppercase}
.doc .code{font-family:var(--fm);font-size:.72rem;color:var(--mute);text-align:right;white-space:nowrap}

/* trilho de etapas */
.steps{list-style:none;margin:14px 0 6px;padding:0;display:flex;gap:6px}
.steps li{flex:1;border-top:5px solid var(--line);padding-top:7px;font-family:var(--fh);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mute);display:flex;align-items:center;gap:7px}
.steps li i{font-style:normal;font-family:var(--fm);font-size:.72rem;width:20px;height:20px;border:1.5px solid currentColor;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.steps li.cur{border-top-color:var(--acc);color:var(--ink)}
.steps li.cur i{background:var(--acc);border-color:var(--acc);color:#fff}
.steps li.done{border-top-color:var(--ink);color:var(--ink)}

.note{margin:14px 0 0;padding:10px 12px;background:var(--warn-bg);color:var(--warn);font-size:.85rem;border-radius:3px}
.panel{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:3px;padding:18px;margin-top:14px}
.panel h2{margin:0 0 4px;font-family:var(--fh);font-weight:700;font-size:1.4rem}
.meta{color:var(--mute);font-size:.88rem}
.meta b{color:var(--ink);font-weight:600}
.back{background:none;border:0;color:var(--mute);font-weight:500;min-height:44px;padding:0;margin-top:6px}

label{display:block;font-weight:600;font-size:.9rem;margin:16px 0 6px}
label small{font-weight:400;color:var(--mute)}
input[type=text],input[type=number],textarea{width:100%;border:1.5px solid var(--edge);border-radius:3px;background:var(--field);color:var(--ink);font:inherit;padding:11px 12px;min-height:48px}
input.mono{font-family:var(--fm)}
input[readonly]{background:transparent;border-style:dashed;color:var(--mute)}
textarea{min-height:76px}
input[type=file]{width:100%;font:inherit;color:var(--ink);padding:10px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scanbox{display:flex;gap:8px}.scanbox input{flex:1}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);font-family:var(--fh);font-weight:700;font-size:1.05rem;text-transform:uppercase;letter-spacing:.6px}
.btn.primary{background:var(--accfill);border-color:var(--accfill);color:#fff}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:var(--edge);color:var(--mute)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.linkbtn{background:none;border:0;color:var(--acc);font-weight:600;min-height:44px;padding:0}

.seg{display:grid;gap:8px;margin-top:2px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}.c4{grid-template-columns:repeat(4,1fr)}
.opt{min-height:48px;border:1.5px solid var(--edge);border-radius:3px;background:var(--card);color:var(--ink);font-weight:600;padding:0 6px}
.opt[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.opt.good[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
:root[data-theme="dark"] .opt.good[aria-pressed=true],:root[data-theme="dark"] .opt.bad[aria-pressed=true]{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .opt.good[aria-pressed=true],:root:not([data-theme="light"]) .opt.bad[aria-pressed=true]{color:#111}}

.hint{margin-top:14px;padding:10px 12px;border-radius:3px;font-size:.88rem;background:var(--warn-bg);color:var(--warn)}
.hint.err{background:var(--bad-bg);color:var(--bad)}
.hint.good{background:var(--ok-bg);color:var(--ok)}
.res{margin-top:14px;padding:14px;border-radius:3px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.res.good{background:var(--ok-bg);color:var(--ok)}
.res.err{background:var(--bad-bg);color:var(--bad)}
.res .lido{font-family:var(--fm);color:var(--ink)}
.res .full{flex-basis:100%}
.stamp{display:inline-block;font-family:var(--fm);font-weight:500;font-size:.85rem;letter-spacing:1.5px;border:2px solid currentColor;padding:2px 8px;border-radius:3px;transform:rotate(-2deg);text-transform:uppercase;white-space:nowrap}

/* faixa de códigos */
.sub{font-family:var(--fh);font-weight:600;font-size:.95rem;text-transform:uppercase;letter-spacing:1px;color:var(--mute);margin:20px 0 8px}
.codes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:400px){.codes{grid-template-columns:repeat(2,1fr)}}
.code{border:1.5px solid var(--edge);border-radius:3px;background:var(--card);color:var(--ink);padding:8px 10px;text-align:left;min-height:62px}
.code b{display:block;font-family:var(--fh);font-size:1.1rem;text-transform:uppercase}
.code span{font-size:.75rem;color:var(--mute)}
.code.ok{border-color:var(--ok);background:var(--ok-bg)}.code.ok span{color:var(--ok);font-weight:600}
.code.nok{border-color:var(--acc);background:var(--bad-bg)}.code.nok span{color:var(--bad);font-weight:600}

.bar{height:8px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--ink)}
.count{font-family:var(--fm);font-size:.78rem;color:var(--mute);margin-top:4px}
ul.items{list-style:none;margin:8px 0 0;padding:0}
.it{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:11px 12px;margin-top:8px;color:var(--ink);min-height:58px}
.it:disabled{opacity:.5;cursor:not-allowed}
.it .l{flex:none;width:32px;height:32px;border-radius:3px;background:var(--ink);color:var(--paper);font-family:var(--fm);font-weight:500;display:flex;align-items:center;justify-content:center}
.it.done .l{background:var(--ok);color:#fff}
.it.nok .l{background:var(--acc);color:#fff}
.it .q{flex:1;font-size:.86rem}
.chip{flex:none;font-family:var(--fm);font-size:.68rem;font-weight:500;padding:3px 8px;border-radius:3px;background:var(--line);color:var(--mute);white-space:nowrap;text-transform:uppercase}
.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.nok{background:var(--bad-bg);color:var(--bad)}.chip.na{background:var(--warn-bg);color:var(--warn)}
.thumb{max-width:100%;border-radius:3px;margin-top:10px}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px}.chk input{width:22px;height:22px}.chk label{margin:0;font-weight:400}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-family:var(--fh);text-transform:uppercase;letter-spacing:.6px;font-size:.78rem;color:var(--mute);padding:6px 4px;border-bottom:2px solid var(--ink)}
td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.mono{font-family:var(--fm)}
.hrow{width:100%;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:3px;padding:12px;margin-top:8px;color:var(--ink);min-height:60px}
.hrow b{font-family:var(--fm);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin-top:10px;font-size:.9rem}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500}

.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.9rem}
.who .sp{flex:1}
.mach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc{text-align:left;border:1.5px solid var(--edge);border-left-width:6px;border-radius:3px;background:var(--card);color:var(--ink);padding:10px 12px;min-height:78px}
.mc b{font-family:var(--fh);text-transform:uppercase;font-size:1.05rem;display:block}
.mc span{font-size:.78rem;color:var(--mute);display:block;line-height:1.3}
.mc.free{border-left-color:var(--ok)}.mc.busy{border-left-color:var(--ink)}.mc.an{border-left-color:var(--acc);background:var(--bad-bg)}
.menu{display:grid;gap:10px}
.mbtn{display:flex;align-items:center;gap:14px;min-height:64px;border:1.5px solid var(--ink);border-radius:3px;background:var(--card);color:var(--ink);padding:0 16px;font-family:var(--fh);font-weight:700;font-size:1.2rem;text-transform:uppercase;letter-spacing:.6px;text-align:left;width:100%}
.mbtn.primary{background:var(--accfill);border-color:var(--accfill);color:#fff}
.mbtn svg{width:26px;height:26px;flex:none}
.badge{margin-left:auto;min-width:28px;height:28px;border-radius:14px;background:var(--acc);color:#fff;font-family:var(--fm);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.badge.zero{background:var(--line);color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fchip{min-height:40px;padding:0 12px;border:1.5px solid var(--edge);border-radius:20px;background:var(--card);color:var(--ink);font-weight:600;font-size:.85rem}
.fchip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hrow .tx{font-size:.84rem;line-height:1.35}
.hrow .tx b{font-family:var(--fh);font-size:1rem;text-transform:uppercase}
.hrow .rt{text-align:right;flex:none}
.hrow .rt .meta{display:block;margin-top:4px;font-size:.75rem}
.parecer{border-left:4px solid var(--acc);background:var(--bad-bg);padding:10px 12px;margin-top:10px;font-size:.88rem;border-radius:3px}

.zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.zoom img{max-width:100%;max-height:100%;border-radius:3px}
.zoom button{position:absolute;top:12px;right:12px;min-width:48px;min-height:48px;background:#fff;color:#000;border:0;border-radius:3px;font-size:1.2rem}
.mini{width:84px;height:84px;object-fit:cover;border-radius:3px;border:1px solid var(--line);cursor:zoom-in;margin-top:8px;display:block}
.mini.big{width:100%;max-width:320px;height:auto;max-height:260px;object-fit:contain;background:var(--field)}
.refbox{margin-top:12px;padding:10px;background:var(--field);border:1px dashed var(--edge);border-radius:3px}
.rec{border-top:1px solid var(--line);padding:12px 0}
.rec:first-of-type{border-top:0}
.rh{display:flex;gap:10px;align-items:flex-start}
.rh .l{flex:none;width:28px;height:28px;border-radius:3px;background:var(--ink);color:var(--paper);font-family:var(--fm);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.rh .rq{flex:1;font-size:.86rem}
.rd{margin:6px 0 0 38px;font-size:.84rem;color:var(--mute)}
.mc.free{border-left-color:var(--edge)}
.mc.run{border-left-color:var(--ok);background:var(--ok-bg)}
.rec input[type=file]{margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  /* matrículas de teste: no sistema final vêm do Datasul/RH */
  var PESSOAS={
    '1001':{nome:'Operador Demo 1',funcao:'Operador de máquina'},
    '1002':{nome:'Operador Demo 2',funcao:'Operador de máquina'},
    '9001':{nome:'Qualidade Demo',funcao:'Qualidade'}
  };
  var ITEMS=[
    {c:'OP',q:'Bipar o código de barras da ordem de produção (OP).',hide:true,scan:{key:'op',lab:'Cód. da OP',hint:'bipe o código da OP'}},
    {c:'lim',q:'Verificar limpeza da caçamba / balança e encaixotadora.'},
    {c:'bag',q:'Verificar código do bag e registrar.',scan:{key:'bag',lab:'Cód. do Bag',hint:'bipe'}},
    {c:'prod',q:'Verificar se o produto dentro do bag está correto.'},
    {c:'cx',q:'Verificar código da caixa e registrar no campo "Cód.".',scan:{key:'caixa',lab:'Cód. da Caixa',hint:'digite; bipe só se tiver QR'}},
    {c:'film',q:'Verificar código da bobina do filme (arte correta) e registrar.',scan:{key:'filme',lab:'Cód. do Filme (QR Code)',hint:'bipe o QR'}},
    {c:'ean',q:'Verificar leitura do código de barras e a integridade do código de barras do pacote.',usaBar:true,scan:{key:'ean',lab:'Cód. de barras do pacote (EAN13 ou código do item)',hint:'bipe ou digite'}},
    {c:'bal',q:'Verificar calibração da balança e peso do produto.'},
    {c:'sel',q:'Verificar selagem traseira, superior e inferior, e a resistência do Eurolock (testar leve tração).'},
    {c:'qtd',q:'Verificar quantidade de peças e registrar.',qtd:true},
    {c:'dun',q:'Etiqueta coletiva (Videojet): verificar leitura do código de barras (DUN14), isento de falhas, e o peso.',scan:{key:'dun',lab:'Cód. de barras da etiqueta coletiva (DUN14)',hint:'bipe ou digite'}},
    {c:'peso',q:'Verificar a calibração da balança dinâmica e o peso do produto: comparar o peso da etiqueta com o peso real e conferir.',pesoEt:true,foto:true},
    {c:'fim',q:'Setup conferido e liberado para produção.',final:true}
  ];
  /* letras em sequência, calculadas: se um item entrar ou sair, o alfabeto se ajusta */
  var LET={};ITEMS.filter(function(i){return !i.hide;}).forEach(function(i,k){LET[i.c]=String.fromCharCode(65+k);});
  function lt(c){return c==='OP'?'OP':LET[c];}
  var TURNOS=['1º Turno','2º Turno'];
  var ST={andamento:['Em andamento',''],analise:['Em análise','nok'],iniciada:['Máquina iniciada','ok'],aguardando:['Aguardando aprovação','na'],aprovado:['Aprovado','ok'],reprovado:['Reprovado','nok']};
  var FILTROS=[['todos','Todos'],['andamento','Em andamento'],['analise','Em análise'],['iniciada','Máquina iniciada'],['aguardando','Aguardando aprovação'],['aprovado','Aprovados'],['reprovado','Reprovados']];
  var KEY='checklist-setup-v9',ITKEY='checklist-setup-itens9',RKEY='checklist-setup-refs9';
  var DB={mat:'',oper:'',funcao:'',role:'Operador',seq:0,setups:[]};
  try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.setups)DB=p;}}catch(e){}
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
  var S={view:DB.mat?'home':'start',id:null,cur:null,draft:null,msg:'',q:'',flt:'todos',back:'home',flash:'',cancel:false,preMaq:null,tests:[]};
  function cat(){var m={};try{m=JSON.parse(localStorage.getItem(ITKEY)||'{}');}catch(e){}
    if(!m['60693'])m['60693']={itemOp:'60693',desc:'ESPAÇADOR NIVELADOR 1,0 mm (exemplo)',bag:'40062',caixa:'72082',filme:'73587',ean:'7891234560018',dun:'17891234560015'};return m;}
  function saveItem(o){try{var m=cat();m[o.itemOp]=o;localStorage.setItem(ITKEY,JSON.stringify(m));}catch(e){}}
  function refs(){try{return JSON.parse(localStorage.getItem(RKEY)||'{}');}catch(e){return {};}}
  function setRef(c,u){try{var r=refs();if(u)r[c]=u;else delete r[c];localStorage.setItem(RKEY,JSON.stringify(r));}catch(e){}}
  function shrink(file,cb){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=720,k=Math.min(1,m/Math.max(im.width,im.height));var cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',0.7));};im.onerror=function(){cb('');};im.src=fr.result;};fr.onerror=function(){cb('');};fr.readAsDataURL(file);}
  function zoom(src){var o=document.createElement('div');o.className='zoom';o.innerHTML='<button aria-label="Fechar">✕</button><img alt="Foto ampliada" src="'+src+'">';o.addEventListener('click',function(){o.remove();});document.body.appendChild(o);}
  document.addEventListener('click',function(e){var z=e.target.closest('[data-zoom]');if(z)zoom(z.getAttribute('src'));});
  var app=document.getElementById('app');
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
  function pad(n){return n<10?'0'+n:''+n;}
  function stamp(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
  function fmt(s){var d=new Date(s);if(isNaN(d))return s;return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
  function hm(s){var d=new Date(s);return isNaN(d)?'':pad(d.getHours())+':'+pad(d.getMinutes());}
  function item(c){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].c===c)return ITEMS[i];}
  function T(){for(var i=0;i<DB.setups.length;i++)if(DB.setups[i].id===S.id)return DB.setups[i];return null;}
  function isQ(){return DB.role==='Qualidade';}
  function resp(c,t){t=t||T();return t.ans[c]?t.ans[c].r:null;}
  function answered(t){return ITEMS.filter(function(i){return resp(i.c,t);}).length;}
  function othersDone(t){return ITEMS.every(function(i){return i.final||resp(i.c,t);});}
  function anyNok(t){return ITEMS.some(function(i){return resp(i.c,t)==='Não OK';});}
  function canFinish(t){return othersDone(t)&&resp('fim',t)==='Liberado para produção'&&!anyNok(t);}
  function stChip(t){var s=ST[t.status]||ST.andamento;return '<span class="chip '+s[1]+'">'+s[0]+'</span>';}
  function chipOf(a){
    var r=a?a.r:null;
    if(!r)return '<span class="chip">Pendente</span>';
    if(a.quality)return '<span class="chip nok">Qualidade acionada</span>';
    if(a.byQ)return '<span class="chip ok">OK (Qualidade)</span>';
    if(a.conf==='sem'&&r==='OK')return '<span class="chip na">OK · sem referência</span>';
    var cls=r==='OK'||r==='Liberado para produção'?'ok':(r==='Não OK'||r==='Não liberado'?'nok':'na');
    return '<span class="chip '+cls+'">'+esc(r)+'</span>';
  }
  function norm(s){return String(s||'').trim().toUpperCase();}

  function expList(sc,t){var m={op:[t.op],bag:[t.bag],caixa:[t.caixa],filme:[t.filme],ean:[t.ean,t.itemOp],dun:[t.dun]};return (m[sc.key]||[]).filter(Boolean);}

  function matches(lido,list){lido=norm(lido);
    return list.some(function(e){e=norm(e);if(lido===e)return true;
      return new RegExp('(^|[^0-9A-Z])'+esq(e)+'($|[^0-9A-Z])').test(lido);});}

  /* leitor: aceita Enter, Tab, ou rajada de caracteres sem tecla final (cada leitor se comporta de um jeito) */
  function bindScan(el,onScan){
    var times=[],timer=null,lastVal='',lastAt=0,prevLen=0,scanLike=false;
    function fire(){clearTimeout(timer);var v=el.value.trim();if(!v)return;if(v===lastVal&&Date.now()-lastAt<1200)return;lastVal=v;lastAt=Date.now();times=[];scanLike=false;onScan(v);}
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key==='Tab'){if(el.value.trim()){e.preventDefault();fire();}}});
    el.addEventListener('input',function(){
      var n=Date.now(),added=el.value.length-prevLen;prevLen=el.value.length;
      times.push(n);clearTimeout(timer);
      var fast=times.length>=4&&((times[times.length-1]-times[0])/(times.length-1))<45;
      if(fast||added>=6){scanLike=true;timer=setTimeout(fire,150);}
    });
    el.addEventListener('change',function(){if(scanLike)fire();});
  }

    }
    h+='<label>Resposta</label><div class="seg '+(opts.length===2?'c2':'c3')+'" id="segR">'+opts.map(function(o){return '<button type="button" class="opt '+o[1]+'" data-r="'+esc(o[0])+'" aria-pressed="'+(d.r===o[0])+'">'+esc(o[0])+'</button>';}).join('')+'</div>';
    if(i.qtd)h+='<label for="qtd">Quantidade de peças <small>(número)</small></label><input id="qtd" type="number" inputmode="numeric" step="1" min="0" class="mono" value="'+esc(d.qtd)+'">';
    if(i.pesoEt){
      h+='<div class="row"><div><label for="pesoEt">Peso da etiqueta <small>(kg)</small></label><input id="pesoEt" type="number" inputmode="decimal" step="0.01" class="mono" value="'+esc(d.pesoEt)+'"></div>'+
        '<div><label for="pesoReal">Peso real <small>(kg)</small></label><input id="pesoReal" type="number" inputmode="decimal" step="0.01" class="mono" value="'+esc(d.pesoReal)+'"></div></div><div id="diff"></div>';
    }
    h+='<label for="foto">Foto '+(i.foto?'da etiqueta colada':'<small>(opcional)</small>')+'</label><input id="foto" type="file" accept="image/*" capture="environment">';
    if(d.img)h+='<img class="mini big" data-zoom src="'+d.img+'" alt="Foto do item '+lt(i.c)+'">';
    else if(d.foto)h+='<div class="hint good">Foto registrada: '+esc(d.foto)+'</div>';
    if(i.foto)h+='<div class="chk"><input id="sem" type="checkbox"'+(d.sem?' checked':'')+'><label for="sem">Não utilizei etiqueta</label></div>';
    h+='<label for="obs">Observações <small>(opcional)</small></label><textarea id="obs">'+esc(d.obs)+'</textarea>'+
      (S.msg?'<div class="hint err">'+esc(S.msg)+'</div>':'')+
      '<div class="actions"><button class="btn primary" id="bSave">Salvar e voltar</button></div></div>';
    page(3,h);
    function grab(){['cod','qtd','pesoEt','pesoReal','obs'].forEach(function(k){if($(k))d[k]=$(k).value.trim();});if($('sem'))d.sem=$('sem').checked;}
    function check(){
      grab();if(!d.cod){S.msg='Bipe ou digite o código.';render();return;}
      var ok=matches(d.cod,list)?true:(semRef(sc,t)?null:false);
      t.log.push({c:i.c,lido:d.cod,esp:list.join(' ou '),ok:ok,em:new Date().toISOString(),operador:DB.oper});
      d.conf=ok===null?'sem':ok;S.msg='';if(ok===true){d.quality=false;d.r='OK';}persist();render();
    }
    function diff(){var el=$('diff');if(!el)return;var pe=parseFloat($('pesoEt').value),pr=parseFloat($('pesoReal').value);
      el.innerHTML=(isFinite(pe)&&isFinite(pr))?'<div class="hint'+(Math.abs(pe-pr)<0.005?' good':'')+'">Diferença entre etiqueta e peso real: <b>'+(pe-pr).toFixed(2)+' kg</b></div>':'';}
    ['pesoEt','pesoReal'].forEach(function(k){if($(k))$(k).addEventListener('input',diff);});diff();
    $('bBack').addEventListener('click',function(){go('list');});
    $('segR').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;grab();d.r=b.dataset.r;if(d.r!=='Não OK')d.quality=false;S.msg='';render();});
    $('foto').addEventListener('change',function(){grab();var f=this.files&&this.files[0];if(f){d.foto=f.name;shrink(f,function(u){d.img=u;S.msg='';render();});}});
    if($('segUsa'))$('segUsa').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;grab();d.usa=b.dataset.u==='sim';
      if(!d.usa){d.r='Não se aplica';d.conf=null;d.cod='';d.quality=false;}else if(d.r==='Não se aplica')d.r=null;render();});
    if(sc&&usaOn){
      $('bCheck').addEventListener('click',check);
      bindScan($('cod'),check);
      if(!d.cod)setTimeout(function(){var el=$('cod');if(el)el.focus();},50);
      var rt=$('bRetry');if(rt)rt.addEventListener('click',function(){d.cod='';d.conf=null;d.r=null;d.quality=false;render();setTimeout(function(){var el=$('cod');if(el)el.focus();},50);});
      var q=$('bQual');if(q)q.addEventListener('click',function(){grab();
        t.ans[S.cur]=snap(d,{r:'Não OK',conf:false,quality:true});
        t.status='analise';persist();S.flash='';S.back='home';go('view');});
    }
    $('bSave').addEventListener('click',function(){
      grab();var err='',ok=d.r==='OK';
      if(!d.r)err='Escolha a resposta.';
      else if(sc&&usaOn&&ok&&!d.cod)err='Confira o código antes de responder OK.';
      else if(sc&&usaOn&&ok&&d.conf!==true&&d.conf!=='sem')err='O código ainda não foi aprovado na conferência.';
      else if(i.qtd&&ok&&(d.qtd===''||isNaN(parseFloat(d.qtd))))err='Informe a quantidade de peças.';
      else if(i.pesoEt&&ok&&(isNaN(parseFloat(d.pesoEt))||isNaN(parseFloat(d.pesoReal))))err='Informe o peso da etiqueta e o peso real.';
      else if(i.foto&&ok&&!d.foto&&!d.sem)err='Anexe a foto da etiqueta ou marque que não utilizou etiqueta.';
      if(err){S.msg=err;render();return;}
      t.ans[S.cur]=snap(d,{quality:d.quality&&d.r==='Não OK'});
      if(d.r==='Não liberado')t.status='analise';
      persist();S.back='home';go(t.status==='andamento'?'list':'view');
    });
  }

  /* ---------- consultar ---------- */
  function rowsHtml(){
    var q=norm(S.q);
    var l=DB.setups.filter(function(t){
      if(S.flt!=='todos'&&t.status!==S.flt)return false;
      if(!q)return true;
      return norm([t.protocolo,t.op,t.itemOp,t.desc,t.operador,t.mat,'EMPACOTADORA '+t.maq].join(' ')).indexOf(q)>=0;
    }).sort(function(a,b){return b.dt<a.dt?-1:1;});
    if(!l.length)return '<div class="hint">Nenhum checklist encontrado.</div>';
    return l.map(function(t){return '<button class="hrow" data-id="'+t.id+'"><span class="tx"><b>Protocolo '+t.protocolo+' · Empacotadora '+esc(t.maq)+'</b><br>ITEM: '+esc(t.itemOp)+' - '+esc(t.desc)+'<br>OP: '+esc(t.op)+(t.demo?' · demonstração':'')+'</span><span class="rt">'+stChip(t)+'<span class="meta">'+esc(t.turno)+' · '+hm(t.dt)+'</span></span></button>';}).join('');
  }
  function viewConsult(){
    page(0,'<button class="back" id="bBack">‹ Voltar</button><div class="panel"><h2>'+(S.flt==='analise'?'Em análise':S.flt==='aguardando'?'Aguardando aprovação':'Checklists')+'</h2>'+
      '<label for="q" style="margin-top:12px">Buscar <small>(protocolo, OP, item, operador, máquina)</small></label><input id="q" type="text" autocomplete="off" value="'+esc(S.q)+'">'+
      '<div class="filters" id="fl">'+FILTROS.map(function(f){return '<button class="fchip" data-f="'+f[0]+'" aria-pressed="'+(S.flt===f[0])+'">'+f[1]+'</button>';}).join('')+'</div>'+
      '<div id="rows">'+rowsHtml()+'</div></div>');
    $('bBack').addEventListener('click',function(){go('home');});
    $('q').addEventListener('input',function(){S.q=this.value;$('rows').innerHTML=rowsHtml();});
    $('fl').addEventListener('click',function(e){var b=e.target.closest('[data-f]');if(!b)return;S.flt=b.dataset.f;render();});
    $('rows').addEventListener('click',function(e){var b=e.target.closest('[data-id]');if(!b)return;S.id=b.dataset.id;S.back='consult';var t=T();go(!isQ()&&t.status==='andamento'?'list':'view');});
  }

  /* ---------- fotos de referência (Qualidade) ---------- */
  function viewRefs(){
    var rf=refs();
    page(0,'<button class="back" id="bBack">‹ Voltar</button><div class="panel"><h2>Fotos de referência</h2><div class="meta">Uma foto por item, para ilustrar ao operador o que conferir. Ela aparece no topo da conferência.</div>'+
      ITEMS.filter(function(i){return !i.hide;}).map(function(i){
        return '<div class="rec"><div class="rh"><span class="l">'+lt(i.c)+'</span><span class="rq">'+esc(i.q)+'</span></div>'+
          (rf[i.c]?'<img class="mini" data-zoom src="'+rf[i.c]+'" alt="Referência do item '+lt(i.c)+'"><button class="linkbtn" data-del="'+i.c+'">Remover foto</button>':'')+
          '<input type="file" accept="image/*" data-ref="'+i.c+'" aria-label="Foto de referência do item '+lt(i.c)+'"></div>';}).join('')+'</div>');
    $('bBack').addEventListener('click',function(){go('home');});
    app.querySelector('.panel').addEventListener('change',function(e){var c=e.target.dataset.ref,f=e.target.files&&e.target.files[0];if(c&&f)shrink(f,function(u){if(u)setRef(c,u);render();});});
    app.querySelector('.panel').addEventListener('click',function(e){var c=e.target.dataset.del;if(c){setRef(c,null);render();}});
  }

  /* ---------- registro + decisões ---------- */
  function summary(t){
    var rows=ITEMS.filter(function(i){return !i.hide;}).map(function(i){
      var a=t.ans[i.c]||{},det=[];
      if(a.usa===false)det.push('Produto sem código de barras');
      if(a.cod)det.push('Código lido: <span class="mono">'+esc(a.cod)+'</span>');
      if(a.qtd)det.push('Quantidade: '+esc(a.qtd)+' peças');
      if(a.pesoEt||a.pesoReal)det.push('Peso da etiqueta '+esc(a.pesoEt||'-')+' kg · peso real '+esc(a.pesoReal||'-')+' kg');
      if(a.sem)det.push('Sem etiqueta');
      if(a.obs)det.push('Obs.: '+esc(a.obs));
      return '<div class="rec"><div class="rh"><span class="l">'+lt(i.c)+'</span><span class="rq">'+esc(i.q)+'</span>'+chipOf(a)+'</div>'+
        (det.length?'<div class="rd">'+det.join('<br>')+'</div>':'')+
        (a.img?'<img class="mini" data-zoom src="'+a.img+'" alt="Foto do item '+lt(i.c)+'. Toque para ampliar">':'')+'</div>';
    }).join('');
    var lrows=t.log.map(function(l){var it=item(l.c),nm=it&&it.scan?it.scan.lab:'';
      return '<tr><td class="mono">'+lt(l.c)+'</td><td>'+esc(nm)+'</td><td class="mono">'+esc(l.lido)+'</td><td>'+(l.ok===null?'<span class="chip na">Sem referência</span>':(l.ok?'<span class="chip ok">Aprovado</span>':'<span class="chip nok">Reprovado</span>'))+'</td></tr>';}).join('');
    function kv(k,v){return v?'<dt>'+k+'</dt><dd>'+v+'</dd>':'';}
    return '<div class="panel"><h2>Informações iniciais</h2><dl class="kv">'+kv('Protocolo','<span class="mono">'+t.protocolo+'</span>')+kv('Situação',stChip(t))+kv('Operador',esc(t.operador)+(t.mat?' (matrícula '+esc(t.mat)+')':''))+kv('Empacotadora',esc(t.maq))+kv('Turno',esc(t.turno))+kv('OP','<span class="mono">'+esc(t.op)+'</span>')+kv('Item','<span class="mono">'+esc(t.itemOp)+'</span> '+esc(t.desc))+kv('Checklist iniciado',esc(fmt(t.dt)))+kv('Máquina iniciada',t.iniciadaEm?esc(fmt(t.iniciadaEm)):'')+kv('OP encerrada',t.encerradaEm?esc(fmt(t.encerradaEm)):'')+kv('Decisão final',t.fim?esc(fmt(t.fim)):'')+'</dl></div>'+
      '<div class="panel"><h2>Checklist</h2><div class="meta">Toque numa foto para ampliar.</div>'+rows+
      '<div class="sub">Códigos lidos ('+t.log.length+')</div><div class="tw"><table><thead><tr><th>Item</th><th>Código</th><th>Lido</th><th>Resultado</th></tr></thead><tbody>'+(lrows||'<tr><td colspan="4">Nenhuma leitura.</td></tr>')+'</tbody></table></div></div>';
  }
  function viewDetailRec(){
    var t=T();if(!t){go('home');return;}
    var flagged=ITEMS.filter(function(i){var a=t.ans[i.c];return a&&(a.quality||a.r==='Não OK'||a.r==='Não liberado');}).map(function(i){return lt(i.c);});
    var banner='';
    if(S.msg==='ok')banner='<div class="hint good" style="margin-top:14px">Checklist concluído. Máquina iniciada.</div>';
    else if(S.msg==='sem')banner='<div class="hint" style="margin-top:14px">Checklist concluído, mas há códigos sem referência na base. A Qualidade precisa conferir antes de seguir.</div>';
    else if(t.status==='analise')banner='<div class="hint err" style="margin-top:14px">Qualidade acionada'+(flagged.length?'. Itens apontados: <b>'+flagged.join(', ')+'</b>':'')+'.</div>';
    var par=(t.pareceres||[]).map(function(p){return '<div class="parecer"><b>'+esc(p.decisao)+'</b> · '+esc(p.por)+' · '+esc(fmt(p.em))+'<br>'+esc(p.texto||'')+'</div>';}).join('');
    var act='';
    if(isQ()){
      if(t.status==='analise')act='<div class="panel"><h2>Decisão da Qualidade</h2><label for="par">Parecer <small>(obrigatório)</small></label><textarea id="par"></textarea><div id="pmsg"></div><div class="actions"><button class="btn primary" id="bLib">Liberar e devolver ao operador</button><button class="btn" id="bRep">Reprovar</button></div></div>';
      else if(t.status==='aguardando')act='<div class="panel"><h2>Aprovação do checklist</h2><div class="meta">Confira se o checklist foi feito corretamente: respostas, códigos lidos e fotos.</div><label for="par">Parecer <small>(obrigatório só para reprovar)</small></label><textarea id="par"></textarea><div id="pmsg"></div><div class="actions"><button class="btn primary" id="bApr">Aprovar checklist</button><button class="btn" id="bRep">Reprovar</button></div></div>';
      else if(t.status==='andamento'||t.status==='iniciada')act='<div class="hint">Acompanhando. A Qualidade só interfere quando é acionada e na aprovação final.</div>';
    }else{
      if(t.status==='iniciada')act='<div class="panel"><h2>Máquina iniciada</h2><div class="meta">Quando a OP terminar, envie o checklist para a aprovação da Qualidade. A máquina fica livre para a próxima OP.</div><div class="actions"><button class="btn primary" id="bEnc">Encerrar OP e enviar para aprovação</button></div></div>';
      else if(t.status==='analise')act='<div class="hint">Aguardando a Qualidade decidir. Este checklist não pode ser alterado enquanto isso.</div>';
      else if(t.status==='aguardando')act='<div class="hint">Enviado para aprovação da Qualidade.</div>';
    }
    page(0,'<button class="back" id="bBack">‹ Voltar</button>'+banner+par+summary(t)+act);
    $('bBack').addEventListener('click',function(){S.msg='';go(S.back==='consult'?'consult':'home');});
    function dec(kind){
      var tx=$('par').value.trim();
      if(!tx&&kind!=='apr'){$('pmsg').innerHTML='<div class="hint err">Escreva o parecer.</div>';return;}
      var nome={lib:'Liberado pela Qualidade',rep:'Reprovado pela Qualidade',apr:'Aprovado pela Qualidade'}[kind];
      t.pareceres.push({decisao:nome,por:DB.oper,em:new Date().toISOString(),texto:tx});
      if(kind==='lib'){
        Object.keys(t.ans).forEach(function(c){var a=t.ans[c];if(a.quality||a.r==='Não OK'){t.ans[c]=Object.assign({},a,{r:'OK',quality:false,byQ:true});}});
        if(resp('fim',t)==='Não liberado')delete t.ans.fim;
        var base=Object.assign({},cat()[t.itemOp]||{itemOp:t.itemOp,desc:t.desc}),map={bag:'bag',cx:'caixa',film:'filme',ean:'ean',dun:'dun'},aprendeu=false;
        Object.keys(map).forEach(function(c){var a=t.ans[c];if(a&&a.conf==='sem'){a.conf=true;a.byQ=true;if(!(c==='ean'&&norm(a.cod)===norm(t.itemOp))){base[map[c]]=a.cod;t[map[c]]=a.cod;aprendeu=true;}}});
        if(aprendeu)saveItem(base);
        if(canFinish(t)){t.status='iniciada';t.iniciadaEm=t.iniciadaEm||new Date().toISOString();}else t.status='andamento';
        S.flash=t.status==='iniciada'?'Liberado. A máquina segue iniciada e os códigos lidos viraram referência na base.':'Liberado. O operador pode continuar o checklist.';
      }else if(kind==='apr'){t.status='aprovado';t.fim=new Date().toISOString();S.flash='Checklist aprovado.';}
      else{t.status='reprovado';t.fim=new Date().toISOString();S.flash='Checklist reprovado.';}
      persist();go('home');
    }
    if($('bLib'))$('bLib').addEventListener('click',function(){dec('lib');});
    if($('bApr'))$('bApr').addEventListener('click',function(){dec('apr');});
    if($('bRep'))$('bRep').addEventListener('click',function(){dec('rep');});
    if($('bEnc'))$('bEnc').addEventListener('click',function(){t.status='aguardando';t.encerradaEm=new Date().toISOString();persist();S.flash='OP encerrada. Checklist enviado para aprovação.';go('home');});
  }

  /* ---------- demonstração (4 máquinas, vários horários) ---------- */
  function seedDemo(){
    if(DB.setups.some(function(t){return t.demo;}))return;
    var items=[
      {itemOp:'62407',desc:'ESPAÇADOR NIVELADOR 1,5 mm ECO (VERMELHO) - C/500 PÇS',bag:'40071',caixa:'72090',filme:'73601',ean:'7891234560025',dun:'17891234560022'},
      {itemOp:'61781',desc:'DESEMP. INOX 6 x 6 / 1/4 x 1/4 in - CABO FDI',bag:'40115',caixa:'72144',filme:'73702',ean:'7891234560032',dun:'17891234560039'},
      {itemOp:'62353',desc:'CUNHA SLIM - PACOTE 100 UN (AUBADE)',bag:'40208',caixa:'72201',filme:'73810',ean:'7891234560049',dun:'17891234560046'}
    ];
    items.forEach(saveItem);
    function mk(maq,turno,op,it,h,m,upto,status,extra){
      var d=new Date();d.setHours(h,m,0,0);
      var t={id:stamp(d)+'-'+maq,protocolo:++DB.seq,operador:'Operador Demo 1',mat:'1001',maq:String(maq),turno:turno,op:op,itemOp:it.itemOp,desc:it.desc,bag:it.bag,caixa:it.caixa,filme:it.filme,ean:it.ean,dun:it.dun,dt:d.toISOString(),status:status,ans:{},log:[],pareceres:[],demo:true};
      var ex={OP:t.op,bag:t.bag,cx:t.caixa,film:t.filme,ean:t.ean,dun:t.dun};
      ITEMS.slice(0,upto).forEach(function(i){
        var a={r:i.final?'Liberado para produção':'OK',cod:'',conf:null,em:d.toISOString()};
        if(ex[i.c]){a.cod=ex[i.c];a.conf=true;t.log.push({c:i.c,lido:a.cod,esp:a.cod,ok:true,em:d.toISOString(),operador:t.operador});}
        if(i.qtd)a.qtd='500';if(i.pesoEt){a.pesoEt='12.4';a.pesoReal='12.4';a.sem=true;}
        t.ans[i.c]=a;});
      var ms=function(min){return new Date(d.getTime()+min*60000).toISOString();};
      if(status==='iniciada'||status==='aguardando'||status==='aprovado')t.iniciadaEm=ms(14);
      if(status==='aguardando'||status==='aprovado')t.encerradaEm=ms(300);
      if(status==='aprovado'){t.fim=ms(330);t.pareceres.push({decisao:'Aprovado pela Qualidade',por:'Qualidade Demo',em:ms(330),texto:''});}
      if(extra&&extra.flag){t.ans[extra.flag]={r:'Não OK',cod:'99999',conf:false,quality:true,em:d.toISOString()};t.log.push({c:extra.flag,lido:'99999',esp:'',ok:false,em:d.toISOString(),operador:t.operador});}
      DB.setups.push(t);return t;
    }
    mk(1,'1º Turno','393064',cat()['60693'],6,5,99,'aprovado');
    mk(2,'1º Turno','331948',items[1],7,20,99,'aguardando');
    mk(1,'1º Turno','393772',items[0],9,40,99,'iniciada');
    mk(3,'2º Turno','235659',items[2],14,10,3,'analise',{flag:'bag'});
    mk(2,'2º Turno','393772',items[0],14,35,6,'andamento');
    persist();
  }

  function render(){
    if(!DB.mat&&S.view!=='start'&&S.view!=='scantest')S.view='start';
    if(isQ()){if(S.view==='setup')S.view='home';if(S.view==='list'||S.view==='detail')S.view='view';}
    if((S.view==='list'||S.view==='detail'||S.view==='view')&&!T())S.view='home';
    ({start:viewStart,home:viewHome,setup:viewSetup,list:viewList,detail:viewDetail,consult:viewConsult,view:viewDetailRec,refs:viewRefs,scantest:viewScanTest})[S.view]();
  }
  render();
})();
</script>
